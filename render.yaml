# A Render Blueprint for the free tier: one web service built from deploy/Dockerfile.single, which runs FalkorDB
# and the app in the same container with no disk. The app loads any scenario graph that is missing at start and
# runs its scripted pass, so a restart heals itself. A free instance sleeps after 15 min without a request and
# wakes on the next one. Render → New → Blueprint → this repository, then Apply; Render asks for the two values
# marked sync: false. See deploy/README.md.
services:
  - type: web
    name: devries                        # the address is <name>.onrender.com when the name is free
    runtime: docker
    dockerfilePath: ./deploy/Dockerfile.single
    plan: free
    region: singapore
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: "8000"
      - key: DEVRIES_PUBLIC
        value: "true"                    # visitors never launch commands; imports are private; nothing is written to a file
      - key: COOKIE_SECURE
        value: "true"
      - key: TRUST_PROXY
        value: "true"                    # Render's proxy, and Vercel's in front of it, are the only things in front
      - key: ALLOWED_HOSTS
        sync: false                      # comma-separated: this service's onrender.com name and the UI's domain
      - key: DEVRIES_MCP_TOKEN
        generateValue: true              # /mcp answers only to this bearer token; read it in the dashboard
      - key: ANTHROPIC_API_KEY
        sync: false                      # optional: paste the key for model-driven runs, or leave empty for scripted ones
      - key: LLM_DAILY_BUDGET_USD
        value: "5"
      - key: PRERUN_MODEL
        value: "false"                   # the start-up pass is scripted; the model is kept for visitors' runs
      - key: SESSION_MAX
        value: "10"
      - key: FALKORDB_MEMORY_CEILING_MB
        value: "200"
