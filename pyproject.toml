[project]
name = "devries"
version = "0.2.0"
description = "Audits a system of AI agents for the paths by which untrusted text can reach a high-impact action, and finds the smallest configuration change that closes each; one graph in FalkorDB"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Kartik Angiras", email = "angiraskartik@gmail.com" }]
keywords = ["security", "ai-agents", "mcp", "falkordb", "graph", "prompt-injection"]
dependencies = [
    "anthropic>=1.13,<2",
    "falkordb>=1.7,<2",
    "fastapi>=0.115",
    "mcp>=2.3,<3",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "pyyaml>=6,<7",
    "uvicorn>=0.32",
]

[project.urls]
Repository = "https://github.com/kartikangiras/DeVries"
Issues = "https://github.com/kartikangiras/DeVries/issues"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.17.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["devries"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 140
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "BLE"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["F811"]        # pytest fixtures are redefined on purpose when a test takes them as parameters
