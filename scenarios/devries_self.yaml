# DeVries, audited by DeVries. The tool list is real: manifests/devries.tools.json is what this
# repository's own MCP server answers to tools/list (`make self-manifest` regenerates it, and a
# test fails if the two drift apart). What each tool reads and writes is stated here from its code.
#
# The auditor reads untrusted text all day: tool names and descriptions come from other people's
# manifests. It can also change a production config, through apply_fix. What keeps the first from
# reaching the second is one gate: apply_fix runs only for a plan a person has approved. So a
# scan of this file must find nothing, and taking the gate away must open exactly one path.
#
# A visitor's question is untrusted text as well, and reaches the auditor without passing through
# a tool, so it is not drawn. It would add nothing: manifest text already taints the auditor.
scenario: devries_self
title: DeVries itself
order: 9
description: DeVries's own auditor and its eleven tools, held to the rules it checks

servers:
  - id: srv:devries
    name: DeVries
    manifest: manifests/devries.tools.json

tools:
  - {id: tool:devries.list_scenarios, reads: [src:graph-facts], capability: read}
  - {id: tool:devries.trust_zones, reads: [src:graph-facts], capability: read}
  - {id: tool:devries.rule_of_two, reads: [src:graph-facts], capability: read}
  # answers carry tool names taken from manifests, wrapped as untrusted
  - {id: tool:devries.find_injection_paths, reads: [src:graph-facts, src:manifest-text], capability: read}
  - {id: tool:devries.find_trifecta_agents, reads: [src:graph-facts, src:manifest-text], capability: read}
  - {id: tool:devries.rank_chokepoints, reads: [src:graph-facts, src:manifest-text], capability: read}
  # a scan stores findings; a proposal stores a plan: audit records, not config
  - {id: tool:devries.scan, reads: [src:graph-facts], writes: [res:audit-records], capability: write}
  # propose_fix also says back what a person typed when rejecting the same plan earlier
  - {id: tool:devries.propose_fix, reads: [src:graph-facts, src:approver-notes], writes: [res:audit-records], capability: write}
  # both test a change in a throwaway copy of the graph
  - {id: tool:devries.simulate_mitigation, reads: [src:graph-facts, src:manifest-text], writes: [res:sandbox-graphs], capability: write}
  - {id: tool:devries.what_if, reads: [src:graph-facts, src:manifest-text], writes: [res:sandbox-graphs], capability: write}
  # the one tool that changes what agents may do
  - {id: tool:devries.apply_fix, writes: [res:agent-config], capability: write}

data_sources:
  - {id: src:manifest-text, name: Manifest text, trust: untrusted}
  - {id: src:approver-notes, name: Approver notes, trust: untrusted}
  - {id: src:graph-facts, name: Graph facts, trust: internal}

resources:
  - {id: res:agent-config, name: Agent configuration, impact: high, external: false}
  - {id: res:audit-records, name: Findings and plans, impact: low, external: false}
  - {id: res:sandbox-graphs, name: Sandbox graphs, impact: low, external: false}

agents:
  - id: agent:auditor
    name: Auditor
    owner: devries
    can_call:
      - tool:devries.list_scenarios
      - tool:devries.scan
      - tool:devries.trust_zones
      - tool:devries.rule_of_two
      - tool:devries.find_injection_paths
      - tool:devries.find_trifecta_agents
      - tool:devries.rank_chokepoints
      - tool:devries.simulate_mitigation
      - tool:devries.what_if
      - tool:devries.propose_fix
      - {id: tool:devries.apply_fix, gate: human_approval}     # a person approves; no tool can

workflows:
  - id: wf:audit
    name: Audit
    description: Scan a scenario, test fixes in sandboxes, propose one, and apply it once a person approves.
    run_by: agent:auditor
    mode: supervised
    needs: [tool:devries.scan, tool:devries.simulate_mitigation, tool:devries.propose_fix, tool:devries.apply_fix]
    reads: [src:graph-facts]

expect:
  injection: []
  trifecta: []
