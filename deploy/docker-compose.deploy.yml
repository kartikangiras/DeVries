# An overlay for a public address: HTTPS in front of the app, and services that come back after a reboot.
#
#   docker compose -f docker-compose.yml -f deploy/docker-compose.deploy.yml up -d --wait --build
#
# The base file already publishes FalkorDB, its Browser and the app on 127.0.0.1 only, so with this
# overlay the one thing reachable from outside is Caddy, on 80 and 443. See deploy/README.md.
name: cistern

services:
  falkordb:
    restart: unless-stopped

  app:
    restart: unless-stopped
    environment:
      COOKIE_SECURE: "true"
      CISTERN_MCP_TOKEN: "${CISTERN_MCP_TOKEN:?set CISTERN_MCP_TOKEN: /mcp must not be open on a public address}"
      LLM_DAILY_BUDGET_USD: "${LLM_DAILY_BUDGET_USD:-5}"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      SITE_ADDRESS: "${SITE_ADDRESS:?set SITE_ADDRESS to the public host name, such as cistern.example.org}"
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data          # certificates: keep them across restarts, or Let's Encrypt will rate-limit
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
