# A CI gate: scan a config that lives in a repository and fail the job if a finding is open.
#
# Copy this into .github/workflows/ of the repository that holds the config, and point `--import` at the
# file. Labels say what is untrusted and what matters; without them nothing is a finding, so give at least
# the ones that are true of your system. Nothing is launched: the saved tools/list files under manifests/
# are what the scan reads, so commit them (an earlier `devries.ingest --import` writes them).
name: devries
on: [push, pull_request]
jobs:
  audit:
    runs-on: ubuntu-latest
    services:
      falkordb:
        image: falkordb/falkordb:6.0.2
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Fetch DeVries
        run: git clone --depth 1 https://github.com/your-org/devries devries && cd devries && uv sync --no-dev
      - name: Scan the config
        env:
          FALKORDB_HOST: localhost
          FALKORDB_PORT: "6379"
        run: |
          cd devries
          uv run python -m devries.ingest --import ../.mcp.json --name ci_scan \
            --label src:github=untrusted --label res:filesystem=high \
            --fail-on open
